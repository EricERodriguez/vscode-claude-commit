<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>

  <!-- Git line (vertical, faint) -->
  <line x1="64" y1="14" x2="64" y2="48" stroke="#2a1a4e" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="80" x2="64" y2="114" stroke="#2a1a4e" stroke-width="3" stroke-linecap="round"/>

  <!-- Git commit ring -->
  <circle cx="64" cy="64" r="24" fill="#100820" stroke="#f97316" stroke-width="2.5" opacity="0.9"/>

  <!-- Sparkle (4-point star) -->
  <path d="
    M64 42
    C64 42 66 55 74 58
    C78 59.5 82 60 82 64
    C82 64 78 64 74 70
    C66 73 64 86 64 86
    C64 86 62 73 54 70
    C50 68.5 46 64 46 64
    C46 64 50 59.5 54 58
    C62 55 64 42 64 42 Z
  " fill="url(#spark)" filter="url(#glow)"/>

  <!-- Git node dots (top and bottom) -->
  <circle cx="64" cy="18" r="4" fill="#2a1a4e" stroke="#3a2a5e" stroke-width="1.5"/>
  <circle cx="64" cy="110" r="4" fill="#2a1a4e" stroke="#3a2a5e" stroke-width="1.5"/>
</svg>
